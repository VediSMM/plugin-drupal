services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: drupal
  drupal:
    image: drupal:11.4.1-php8.4-apache
    depends_on:
      - db
      - fake-api
    environment:
      VEDISMM_API_BASE_URL: http://fake-api:8080/api/v1
    ports:
      - "18090:80"
  fake-api:
    image: php:8.4-cli
    working_dir: /app
    command: php -S 0.0.0.0:8080 router.php
    volumes:
      - ./tests/fake-api:/app:ro
